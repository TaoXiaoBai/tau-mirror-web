<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi 助手 · Tau</title>
  <link rel="icon" type="image/png" href="icons/tau-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tau">
  <meta name="theme-color" content="#f5f3ef">
  <script>
    // Apply theme BEFORE CSS loads — prevents flash of wrong colors on reload
    (function(){
      var t=localStorage.getItem('tau-theme');
      if(t==='dark')t='night';if(t==='light')t='terracotta';
      var v=['night','dawn','midnight','clean','terracotta','sage'];
      if(!t||v.indexOf(t)===-1)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches)?'terracotta':'night';
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="upgrade.css">
  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="mode-toggle" id="mode-toggle">
          <span class="mode-link active" title="Pi 对话"><img src="icons/tau-192.png" alt="Tau" class="tau-icon"></span>
        </div>
        <input type="text" id="session-search-input" class="sidebar-search-input" placeholder="搜索会话或内容" autocomplete="off" aria-label="搜索会话" />
        <div class="sidebar-actions">
          <button class="icon-btn" id="new-session-btn" title="新建会话" aria-label="新建会话"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <button class="icon-btn" id="refresh-sessions-btn" title="刷新会话" aria-label="刷新会话"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
        </div>
      </div>
      <div class="session-list" id="session-list">
        <div class="session-loading">正在读取会话…</div>
      </div>
    </div>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Chat Area -->
    <div class="main">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebar-toggle" title="展开或收起会话栏" aria-label="展开或收起会话栏"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="model-dropdown" id="model-dropdown">
            <button class="model-dropdown-btn" id="model-dropdown-btn" title="切换模型" aria-haspopup="listbox" aria-expanded="false">
              <span class="model-dropdown-kicker">模型</span>
              <span class="model-dropdown-label" id="model-dropdown-label">正在读取…</span>
              <svg class="model-dropdown-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="model-dropdown-menu hidden" id="model-dropdown-menu"></div>
          </div>
          <button class="model-refresh-btn" id="model-refresh-btn" title="重新读取 Pi 的模型配置" aria-label="刷新模型">↻</button>
          <div class="thinking-control" id="thinking-control">
            <button class="thinking-tag" id="thinking-btn" title="设置思考强度" aria-haspopup="listbox" aria-expanded="false">思考：关闭</button>
            <div class="thinking-menu hidden" id="thinking-menu" role="listbox" aria-label="思考强度"></div>
          </div>
          <button class="plan-tag" id="plan-mode-btn" title="切换规划模式（只读探索，等价于 /plan）" aria-pressed="false">规划：关闭</button>
        </div>
        <div class="header-right">
          <div class="pill session-cost" id="session-cost" title="本次会话费用"></div>
          <div style="position: relative;">
            <div class="pill token-usage" id="token-usage" title="查看上下文占用"></div>
            <div class="context-viz hidden" id="context-viz">
              <div class="context-viz-title">上下文空间</div>
              <div class="context-bar" id="context-bar"></div>
              <div class="context-legend" id="context-legend"></div>
              <div class="context-viz-footer">
                <span id="context-viz-used"></span>
                <span id="context-viz-total"></span>
              </div>
            </div>
          </div>
          <div class="status">
            <span class="status-indicator" id="status-indicator"></span>
            <span class="status-text" id="status-text">连接中…</span>
          </div>
          <button class="icon-btn" id="file-sidebar-toggle" title="项目文件" aria-label="打开文件栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </button>
          <button class="settings-btn" id="settings-btn" title="设置" aria-label="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Launcher (project picker) -->
      <div class="launcher hidden" id="launcher"></div>

      <!-- Messages Container -->
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="welcome-icon"><img src="icons/tau-192.png" alt="τ" class="tau-icon-welcome"></div>
          <p>你好，我是 Pi</p>
          <p class="hint">直接输入任务，或从左侧继续之前的会话。</p>
          <div class="shortcuts-hint">
            <span><kbd>/</kbd> 聚焦输入</span>
            <span><kbd>Esc</kbd> 停止生成</span>
          </div>
        </div>
      </div>

      <!-- Scroll to bottom + new message indicator -->
      <button class="scroll-bottom-btn hidden" id="scroll-bottom-btn">
        <span class="scroll-bottom-badge hidden" id="scroll-bottom-badge">有新消息 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></span>
        <span class="scroll-bottom-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></span>
      </button>

      <!-- Typing indicator (hidden, kept for JS reference) -->
      <div class="typing-indicator hidden" id="typing-indicator"></div>

      <!-- Input Area -->
      <div class="input-area">
        <button class="mobile-context-toggle" id="mobile-context-toggle">
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 5L5 1L9 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="mobile-model-bar" id="mobile-model-bar"></div>
        <div class="queued-messages hidden" id="queued-messages"></div>
        <div class="image-previews hidden" id="image-previews"></div>
        <div class="history-resume-bar hidden" id="history-resume-bar">
          <span class="history-resume-copy"><strong>正在查看历史对话</strong><small>恢复完整上下文后，可以从这里接着聊</small></span>
          <button type="button" class="history-resume-btn" id="history-resume-btn" aria-label="恢复并继续这段历史对话">继续对话</button>
        </div>
        <form id="chat-form">
          <div class="input-left-actions">
            <button type="button" class="input-icon-btn" id="command-btn" title="快捷操作" aria-label="打开快捷操作" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
            </button>
            <button type="button" class="input-icon-btn" id="attach-btn" title="添加图片；引用本地文件请使用右侧文件栏" aria-label="添加图片" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </button>

            <input type="file" id="image-input" accept="image/*" multiple style="display:none" />
          </div>
          <div class="input-bubble">
            <textarea
              id="message-input"
              placeholder="输入任务…  Enter 发送，Shift + Enter 换行"
              autocomplete="off"
              rows="2"

            ></textarea>
            <button type="button" class="input-mic-btn" id="mic-btn" title="语音输入" aria-label="语音输入" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>
          </div>
          <div class="input-actions">
            <button type="submit" id="send-btn" title="发送" aria-label="发送" tabindex="-1">
              <span class="send-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></span>
            </button>
            <button type="button" id="abort-btn" class="hidden" title="停止生成（Esc）" aria-label="停止生成" tabindex="-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
          </div>
        </form>
      </div>
    </div>

    <!-- File Browser (right sidebar) -->
    <div class="file-sidebar collapsed" id="file-sidebar">
      <div class="file-sidebar-header">
        <span class="file-sidebar-title" id="file-sidebar-title">项目文件</span>
        <button class="icon-btn" id="file-sidebar-up" title="上一级目录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
        <button class="icon-btn" id="file-sidebar-finder" title="在文件管理器中打开">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="icon-btn" id="file-sidebar-close" title="关闭" aria-label="关闭文件栏"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="file-sidebar-path" id="file-sidebar-path" title=""></div>
      <div class="file-list" id="file-list"></div>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div class="settings-overlay hidden" id="settings-overlay"></div>

  <!-- Settings Panel -->
  <div class="settings-panel hidden" id="settings-panel">
    <div class="settings-header">
      <h3>设置</h3>
      <button class="settings-close" id="settings-close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title">外观</div>
        <div class="theme-grid" id="theme-grid"></div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">助手</div>
        <div class="settings-row" id="setting-auto-compact">
          <span class="settings-label">自动整理上下文</span>
          <button class="settings-toggle" id="toggle-auto-compact"></button>
        </div>
        <div class="settings-row" id="setting-thinking">
          <span class="settings-label">思考强度</span>
          <button class="settings-value-btn" id="btn-thinking-level"></button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">显示</div>
        <div class="settings-row">
          <span class="settings-label">显示思考过程</span>
          <button class="settings-toggle on" id="toggle-show-thinking"></button>
        </div>
      </div>
      <div class="settings-section" id="settings-auth-section" style="display:none">
        <div class="settings-section-title">访问保护</div>
        <div class="settings-row">
          <span class="settings-label">需要登录</span>
          <button class="settings-toggle" id="toggle-auth"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Command Palette -->
  <div class="command-palette-overlay hidden" id="command-palette-overlay"></div>
  <div class="command-palette hidden" id="command-palette">
    <div class="command-palette-header">快捷操作</div>
    <div class="command-list" id="command-list"></div>
  </div>

  <!-- Compact notifications -->
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Dialog Container -->
  <div id="dialog-container" class="hidden"></div>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>
</body>
</html>
